[default_apps]
teams = "teams-for-linux --enable-features=UseOzonePlatform --ozone-platform=wayland --url {meeting_url}"
calendar_client = "thunderbird"
terminal = "foot"
browser = "/opt/zen-browser-bin/zen-bin %u"
mpris = "ncspot"

[units]
lengths = "meters"
weights = "kg"
volumes = "l"
temperatures = "C"
currency = "eur"

[debug]
try_suppress_errors = false
try_suppress_warnings = false
app_paths = []

[appearance]
width = 900
height = 593
gsk_renderer = "cairo"
icon_paths = ["~/.config/sherlock/icons/"]
icon_size = 22
use_base_css = true
opacity = 1
mod_key_ascii = ["⇧", "⇧", "⌘", "⌘", "⎇", "✦", "✦", "⌘"]
num_shortcuts = 5

[behavior]
cache = "~/.cache/sherlock/sherlock_desktop_cache.bin"
caching = true
daemonize = false
animate = false

[binds]
up = "control-k"
down = "control-j"
left = "control-h"
right = "control-l"
modifier = "control"
context = "control-i"
exec_inplace = "control-return"

[files]
config = "~/.config/sherlock/config.toml"
css = "~/.config/sherlock/main.css"
fallback = "~/.config/sherlock/fallback.json"
alias = "~/.config/sherlock/sherlock_alias.json"
ignore = "~/.config/sherlock/sherlockignore"
actions = "~/.config/sherlock/sherlock_actions.json"

[pipe]

[expand]
enable = false
edge = "top"
margin = 400

[backdrop]
enable = false
opacity = 0.6
edge = "bottom"

[status_bar]
enable = true

[search_bar_icon]
enable = true
icon = "system-search-symbolic"
icon_back = "sherlock-back"
size = 22
